name: Perbarui indeks galeri

on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - "!data/index.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bangun ulang data/index.json dan tabel README dari kondisi main saat ini
        id: bangun
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const berkasEntri = fs
              .readdirSync("data")
              .filter(f => f.endsWith(".json") && f !== "index.json");
            const semua = berkasEntri
              .map(f => JSON.parse(fs.readFileSync(path.join("data", f), "utf8")))
              .sort((a, b) => a.idUsecase.localeCompare(b.idUsecase));

            const indeksBaru = JSON.stringify(semua, null, 2) + "\n";
            const indeksLama = fs.existsSync("data/index.json")
              ? fs.readFileSync("data/index.json", "utf8")
              : "";

            const header =
              "| ID | Karya | Kontributor | Instansi | Teknologi |\n" +
              "|---|---|---|---|---|\n";
            const baris = semua
              .map(
                e =>
                  `| ${e.idUsecase} | [${e.namaUsecase}](data/${e.idUsecase}.json) | ` +
                  `${e.kontributor} (@${e.kontributorUsernameGithub}) | ${e.instansi || "—"} | ` +
                  `${(e.teknologi || []).join(", ")} |`
              )
              .join("\n");
            const tabel = header + baris + "\n";
            const mulai = "<!-- GALERI:START -->";
            const selesai = "<!-- GALERI:END -->";
            const readmeLama = fs.readFileSync("README.md", "utf8");
            const re = new RegExp(`${mulai}[\\s\\S]*?${selesai}`);
            const readmeBaru = readmeLama.replace(re, `${mulai}\n${tabel}${selesai}`);

            let berubah = false;
            if (indeksBaru !== indeksLama) {
              fs.writeFileSync("data/index.json", indeksBaru);
              berubah = true;
            }
            if (readmeBaru !== readmeLama) {
              fs.writeFileSync("README.md", readmeBaru);
              berubah = true;
            }
            core.setOutput("berubah", berubah ? "true" : "false");

      - name: Buat/perbarui PR sinkronisasi indeks
        if: steps.bangun.outputs.berubah == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: perbarui data/index.json dan tabel README"
          branch: "chore/perbarui-indeks-galeri"
          title: "chore: perbarui indeks galeri (otomatis)"
          body: |
            Dibuat/diperbarui otomatis setiap kali ada karya baru yang digabung ke `main`.

            Menyinkronkan `data/index.json` dan tabel di README agar sesuai isi folder
            `data/` yang sebenarnya saat PR ini dibuat.
          labels: usecase
