name: Tambah entri galeri dari Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  proses:
    if: contains(github.event.issue.labels.*.name, 'usecase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun berkas entri
        id: susun
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            // Formulir Issue Form merender tiap field sebagai "### Label\n\nisi\n\n".
            const body = context.payload.issue.body || "";
            const bagian = body.split(/\n### /).map(s => s.trim()).filter(Boolean);
            const data = {};
            for (const potongan of bagian) {
              const nl = potongan.indexOf("\n");
              const label = (nl === -1 ? potongan : potongan.slice(0, nl))
                .replace(/^### /, "").trim();
              let isi = (nl === -1 ? "" : potongan.slice(nl + 1)).trim();
              if (isi === "_No response_") isi = "";
              data[label] = isi;
            }

            // Gambar yang diseret ke kotak formulir disisipkan GitHub sebagai markdown
            // "![nama](url)" — sebagian unggahan lama memakai tag <img src="...">.
            function ambilGambar(md) {
              const hasil = [];
              const pola = [
                /!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/g,
                /<img[^>]+src="(https?:\/\/[^"]+)"/g,
              ];
              for (const re of pola) {
                let m;
                while ((m = re.exec(md || "")) !== null) hasil.push(m[1]);
              }
              return [...new Set(hasil)];
            }

            const nomor = context.payload.issue.number;
            const idUsecase = `UC-${String(nomor).padStart(4, "0")}`;
            const entri = {
              idUsecase,
              namaUsecase: data["Nama Use Case / Model Digital Twin"] || "",
              kontributor: data["Nama Kontributor"] || "",
              instansi: data["Instansi / Organisasi"] || "",
              teknologi: (data["Teknologi yang Digunakan"] || "")
                .split(",")
                .map(s => s.trim())
                .filter(Boolean),
              deskripsi: data["Deskripsi Use Case"] || "",
              kontak: data["Kontak"] || "",
              thumbnailUrl: ambilGambar(data["Thumbnail"])[0] || "",
              tangkapanLayar: ambilGambar(data["Tangkapan Layar Aplikasi"]),
              linkAplikasi: data["Link Aplikasi"] || "",
              linkVideo: data["Link Video"] || "",
              kontributorUsernameGithub: context.payload.issue.user.login,
              dibuatPada: context.payload.issue.created_at,
              issue: context.payload.issue.html_url,
            };

            // PR ini HANYA menambahkan satu berkas entri baru. index.json dan README
            // dibangun ulang dari kondisi main yang sebenarnya oleh workflow
            // "Perbarui indeks galeri" setelah PR ini digabung, supaya entri yang
            // digabung berdekatan tidak saling menimpa.
            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync(
              path.join("data", `${idUsecase}.json`),
              JSON.stringify(entri, null, 2) + "\n"
            );

            core.setOutput("id_usecase", idUsecase);
            core.setOutput("nama_usecase", entri.namaUsecase);

      - name: Buat Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Tambah karya: ${{ steps.susun.outputs.nama_usecase }} (${{ steps.susun.outputs.id_usecase }})"
          branch: "usecase/${{ steps.susun.outputs.id_usecase }}"
          title: "Tambah karya: ${{ steps.susun.outputs.nama_usecase }} (${{ steps.susun.outputs.id_usecase }})"
          body: |
            Karya baru dari isian formulir di issue #${{ github.event.issue.number }},
            diajukan oleh @${{ github.event.issue.user.login }}.

            Menambahkan `data/${{ steps.susun.outputs.id_usecase }}.json`. Setelah PR ini
            digabung, `data/index.json` dan tabel di README akan diperbarui otomatis
            oleh workflow terpisah.

            Closes #${{ github.event.issue.number }}
          labels: usecase
